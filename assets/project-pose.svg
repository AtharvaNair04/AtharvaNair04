<text x="48" y="149" font-family="JetBrains Mono, Cascadia Code, Consolas, Menlo, monospace" font-size="14" xml:space="preserve"><tspan fill="#D7DAE0">im    = </tspan><tspan fill="#81D4FA">adaptive_preprocess</tspan><tspan fill="#D7DAE0">(im);</tspan></text>
